<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dispensarium</title>

  <!-- CSS -->
  <link rel="stylesheet" href="/css/styles.css">

  <!-- Favicon (opcional) -->
  <link rel="icon" href="/assets/logo.png">
</head>

<body>

  <!-- LOGIN -->
  <div id="loginOverlay">
    <div class="login-box">
      <div class="logo">
        <img src="/assets/logo.png" style="width:76px;">
        <div>Dispensarium</div>
      </div>

      <input id="loginName" type="text" placeholder="Seu nome completo"/>
      <button onclick="doLogin()">Entrar</button>
    </div>
  </div>

  <!-- APP -->
  <div id="app" style="display:none;">

    <!-- SIDEBAR -->
    <aside class="sidebar">

      <div class="sidebar-user">
        Bem-vindo(a),<br>
        <strong id="sidebarUser">—</strong>
      </div>

      <nav>
        <a class="active" onclick="showPage('kitchen')">
          🍳 Cozinha
        </a>

        <a onclick="showPage('clean')">
          🧹 Limpeza
        </a>

        <a onclick="showPage('report')">
          📊 Relatório
        </a>

        <a onclick="openAddModal()">
          ➕ Adicionar Item
        </a>
      </nav>

      <div class="sidebar-footer">
        <button onclick="doLogout()">⬅️ Sair</button>
      </div>

    </aside>

    <!-- CONTEÚDO -->
    <main>

      <section id="page-kitchen" class="page active">
        <h2>Cozinha</h2>
        <div id="grid-kitchen"></div>
      </section>

      <section id="page-clean" class="page">
        <h2>Limpeza</h2>
        <div id="grid-clean"></div>
      </section>

      <section id="page-report" class="page">
        <h2>Relatório</h2>
        <div id="reportContent"></div>
      </section>

    </main>

  </div>

  <!-- SCRIPTS (ORDEM IMPORTANTE) -->
  <script src="/js/db.js"></script>
  <script src="/js/items.js"></script>
  <script src="/js/movements.js"></script>
  <script src="/js/report.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/app.js"></script>

</body>
</html>
